name: sync-upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: configure git identity
        run: |
          git config user.name "ZG089"
          git config user.email "159061718+ZG089@users.noreply.github.com"
          git config merge.ours.driver true

      - name: check upstream commits and releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git remote add upstream https://github.com/teidesu/inugram.git || true
          git fetch upstream main --tags

          # what the build's Telegram post lists commits from
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          new_commits=$(git rev-list --count HEAD..upstream/main)
          echo "Found $new_commits new commit(s) from upstream/main"
          echo "new_commits=$new_commits" >> "$GITHUB_OUTPUT"

          upstream_tag=$(gh release list -R teidesu/inugram --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          echo "Latest upstream release tag: ${upstream_tag:-none}"

          release_needed=false
          if [ -n "$upstream_tag" ]; then
            if ! gh release view "${upstream_tag}-legacy" 2>/dev/null; then
              release_needed=true
              echo "Release ${upstream_tag}-legacy does not exist yet in fork"
            fi
          fi
          echo "release_needed=$release_needed" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"

      - name: merge upstream commits
        if: steps.check.outputs.new_commits > 0
        env:
          RELEASE_NEEDED: ${{ steps.check.outputs.release_needed }}
        run: |
          echo "Merging upstream/main..."
          msg="Merge upstream/main"
          if [ "$RELEASE_NEEDED" = "true" ]; then
            msg="Merge upstream/main [skip build]"
          fi
          if ! git merge upstream/main -m "$msg"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicts detected in: $conflicts"
            for file in $conflicts; do
              if [ "$file" = "README.md" ] || [ "$file" = "LEGACY.md" ]; then
                git checkout HEAD -- "$file"
                git add "$file"
              fi
            done
            if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
              git commit -m "$msg"
            else
              echo "::error::Unresolvable merge conflict in tracked patches or code"
              exit 1
            fi
          fi
          git push origin main

      - name: sync changelogs from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.check.outputs.upstream_tag }}
        run: |
          mkdir -p changelogs
          git checkout upstream/main -- changelogs/ 2>/dev/null || true

          if [ -n "$UPSTREAM_TAG" ]; then
            build_num=$(echo "$UPSTREAM_TAG" | sed -E 's/.*-([0-9]+)$/\1/')
            if [ -n "$build_num" ] && [ ! -s "changelogs/${build_num}.md" ]; then
              echo "Fetching release notes for $UPSTREAM_TAG from teidesu/inugram..."
              gh release view "$UPSTREAM_TAG" -R teidesu/inugram --json body --jq '.body // ""' > "changelogs/${build_num}.md" 2>/dev/null || true
            fi
          fi

          if [ -n "$(git status --porcelain changelogs/)" ]; then
            echo "Committing synced changelogs..."
            git add changelogs/
            git commit -m "sync: update changelogs from upstream [skip build]"
            git push origin main
          fi

      # exactly one run per sync: a release run already covers the merged commits, so a CI run next to
      # it would build the same thing and post it twice. The push above uses the workflow token, which
      # never starts legacy.yml's push trigger; replace it with a PAT and this step needs revisiting.
      - name: start build
        if: steps.check.outputs.release_needed == 'true' || steps.check.outputs.new_commits > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NEEDED: ${{ steps.check.outputs.release_needed }}
          UPSTREAM_TAG: ${{ steps.check.outputs.upstream_tag }}
          BASE_SHA: ${{ steps.check.outputs.base }}
        run: |
          if [ "$RELEASE_NEEDED" = true ]; then
            echo "Starting release build for ${UPSTREAM_TAG}-legacy"
            gh workflow run legacy.yml -f release=true -f release_tag="${UPSTREAM_TAG}-legacy" -f base_sha="$BASE_SHA"
          else
            echo "Starting CI build"
            gh workflow run legacy.yml -f base_sha="$BASE_SHA"
          fi
