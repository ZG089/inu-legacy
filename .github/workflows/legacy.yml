name: legacy

# Fork-owned: upstream has no such file, so syncing teidesu/inugram never conflicts with it.
# Builds the 32-bit (armeabi-v7a) APK for both variants (full with plugins and pluginless).
# On main, pushes trigger CI builds. When a release is requested or triggered by sync-upstream,
# it signs both APKs and publishes them to GitHub Releases, removing temporary CI artifacts.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - changelogs/**
      - sdk/**
      - src/test/**
      - src/profile/**
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release when the build succeeds
        type: boolean
        default: false
      release_tag:
        description: Optional custom release tag (e.g. v13.2.2-56-legacy)
        type: string
        default: ''

concurrency:
  group: legacy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            worktree: worktree
            setup-args: '--ci'
            suffix: ''
          - variant: pluginless
            worktree: worktree-pluginless
            setup-args: '--ci --pluginless'
            suffix: '-pluginless'
    env:
      COMMIT_ID: ${{ github.sha }}
      INU_BUILD: ${{ github.run_number }}
      INU_BUILD_TYPE: release
      RUST_TARGET: armv7-linux-androideabi
    steps:
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: set up ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          append-timestamp: true
          key: ${{ runner.os }}-legacy-ndk-27.2-29.0-${{ matrix.variant }}-armeabi-v7a
          restore-keys: ${{ runner.os }}-legacy-ndk-27.2-29.0-${{ matrix.variant }}-armeabi-v7a
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: install libclang
        if: matrix.variant == 'full'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libclang-dev

      - name: cache cargo
        if: matrix.variant == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            src/native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/native/Cargo.lock', 'src/native/rust-toolchain.toml') }}-cargo-ndk-4.1.2
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('src/native/Cargo.lock', 'src/native/rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-

      - name: install android rust toolchain
        if: matrix.variant == 'full'
        working-directory: src/native
        run: |
          rustup toolchain install
          rustup target add "$RUST_TARGET"
          if ! cargo ndk --version 2>/dev/null | grep -q '4.1.2'; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi

      - name: set up worktree
        run: pnpm run setup ${{ matrix.setup-args }}

      # wallet-engine carries patches-native, so gradle rebuilds it with the toolchain its source pins
      - name: install wallet engine rust target
        working-directory: ${{ matrix.worktree }}/TMessagesProj/jni/gram-wallet
        run: rustup target add "$RUST_TARGET"

      - name: test native plugin engine
        if: matrix.variant == 'full'
        working-directory: src/native
        run: cargo test --locked

      - name: compute build info
        id: info
        run: |
          ver=$(sed -n 's/^APP_VERSION_NAME=//p' ${{ matrix.worktree }}/gradle.properties)
          [ -n "$ver" ] || { echo '::error::APP_VERSION_NAME not found in gradle.properties'; exit 1; }
          {
            echo "apk=inugram-legacy-$ver-${GITHUB_SHA::7}-$GITHUB_RUN_NUMBER${{ matrix.suffix }}-armeabi-v7a.apk"
            echo "tag=v$ver-legacy.$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            cmake;3.31.6
            ndk;27.2.12479018
            ndk;29.0.14206865

      - name: tune gradle
        run: |
          {
            echo 'org.gradle.caching=true'
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC'
          } >> ~/.gradle/gradle.properties

      - name: build (unsigned, debug-keyed)
        working-directory: ${{ matrix.worktree }}
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime,locale,system_headers
          CCACHE_BASEDIR: ${{ github.workspace }}/${{ matrix.worktree }}
        run: ./gradlew --no-daemon -I "$GITHUB_WORKSPACE/legacy/armv7.init.gradle" :TMessagesProj_App:assembleRelease

      - name: show ccache stats
        if: always()
        run: ccache -s

      - name: stage apk
        run: |
          built=$(find ${{ matrix.worktree }}/TMessagesProj_App/build/outputs/apk/release -name '*.apk')
          [ "$(echo "$built" | wc -l)" = 1 ] || { echo "::error::expected exactly one apk, found: ${built:-none}"; exit 1; }
          abis=$({ unzip -Z1 "$built" 'lib/*' || true; } | cut -d/ -f2 | sed '/^$/d' | sort -u | paste -sd' ')
          [ "$abis" = armeabi-v7a ] || { echo "::error::apk ships ABIs: ${abis:-none}, expected only armeabi-v7a"; exit 1; }
          mkdir -p out
          cp "$built" "out/${{ steps.info.outputs.apk }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-unsigned-${{ matrix.variant }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 3

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (inputs.release || inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;36.0.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: legacy-unsigned-*
          merge-multiple: true
          path: out

      - name: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo '::error::KEYSTORE_BASE64 secret missing, see LEGACY.md'; exit 1; }
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          mkdir -p signed
          for apk in out/*.apk; do
            filename=$(basename "$apk")
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias inugram \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --in "$apk" \
              --out "signed/$filename"
            "$apksigner" verify --print-certs "signed/$filename"
          done

      - name: wipe keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            first_apk=$(find signed -maxdepth 1 -name '*.apk' | head -1)
            ver=$(basename "$first_apk" | sed -E 's/inugram-legacy-([0-9.]+)-.*/\1/')
            tag="v$ver-legacy.${{ github.run_number }}"
          fi

          if target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish 2>/dev/null); then
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::release $tag already exists for $target; re-run the run that created it instead"
              exit 1
            fi
            gh release upload "$tag" signed/*.apk --clobber
          else
            gh release create "$tag" signed/*.apk --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi

      - name: delete CI artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          artifact_ids=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' 2>/dev/null || true)
          for id in $artifact_ids; do
            echo "Deleting artifact $id..."
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" || true
          done
