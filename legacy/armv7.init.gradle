// Packages exactly one ABI, armeabi-v7a, in every Android module of the checkout it is applied to:
//
//   ./gradlew -I <repo>/legacy/armv7.init.gradle <tasks>
//
// Overriding this from an init script keeps stock and patch files byte-identical to upstream,
// guaranteeing zero merge conflicts during syncs.
//
// Supports both pluginless and full (plugin engine) checkouts.
allprojects { project ->
    ['com.android.application', 'com.android.library'].each { id ->
        project.plugins.withId(id) {
            // finalizeDsl runs after the build script and before AGP reads the filter
            project.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                def filters = dsl.defaultConfig.ndk.abiFilters
                filters.clear()
                filters.add('armeabi-v7a')
            }
        }
    }

    project.plugins.withId('com.android.application') {
        project.tasks.matching { it.name ==~ /buildInuNative.*/ }.configureEach { task ->
            // Reconfigure cargo-ndk to target armeabi-v7a instead of hardcoded arm64-v8a
            task.commandLine = task.commandLine.collect { it == 'arm64-v8a' ? 'armeabi-v7a' : it }

            def buildType = task.name.replace('buildInuNative', '').uncapitalize()
            def stockJniTask = "copy${buildType.capitalize()}JniLibsProjectOnly"
            def armv7StockLib = project.project(':TMessagesProj').file("build/intermediates/library_jni/$buildType/$stockJniTask/jni/armeabi-v7a/libtmessages.49.so")
            def arm64StockLib = project.project(':TMessagesProj').file("build/intermediates/library_jni/$buildType/$stockJniTask/jni/arm64-v8a/libtmessages.49.so")
            def sqliteLinkDir = project.file("${project.buildDir}/inuSqliteLink/$buildType")

            task.inputs.file(armv7StockLib)
            task.doFirst {
                // Ensure arm64 directory & symlink exist so upstream inputs/actions resolve cleanly
                if (!arm64StockLib.exists() && armv7StockLib.exists()) {
                    arm64StockLib.parentFile.mkdirs()
                    try {
                        java.nio.file.Files.createSymbolicLink(arm64StockLib.toPath(), armv7StockLib.toPath())
                    } catch (Exception ignored) {
                        java.nio.file.Files.copy(armv7StockLib.toPath(), arm64StockLib.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                }
                sqliteLinkDir.mkdirs()
                new File(sqliteLinkDir, 'libsqlite3.so').text = "INPUT(${armv7StockLib.absolutePath})\n"
            }
        }
    }
}
